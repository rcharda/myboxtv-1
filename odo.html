<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecteur Telegram Direct - Sans Proxy</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0e1621; color: white; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; text-align: center; }
        .info-box { background: #17212b; border-left: 4px solid #5288c1; padding: 15px; margin-bottom: 20px; text-align: left; border-radius: 4px; font-size: 14px; }
        .stream-wrapper { background: #17212b; border-radius: 8px; padding: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { color: #5288c1; margin-bottom: 5px; }
        p { color: #aaaaaa; margin-top: 0; }
        .telegram-feed { 
            width: 100%; 
            height: 600px; 
            border: none; 
            border-radius: 6px; 
            background: #0e1621;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Mon Lecteur Cinéma Telegram</h1>
    <p>Flux direct et instantané depuis les serveurs officiels</p>

    <div class="info-box">
        <strong>🍿 Comment regarder un film ?</strong><br>
        Faites défiler le catalogue ci-dessous. Cliquez simplement sur l'icône de lecture (Play) au centre d'une vidéo pour lancer le streaming directement dans le lecteur.
    </div>

    <div class="stream-wrapper">
        <!-- Widget officiel qui contourne le blocage "Dangereux" de Chrome -->
        <iframe 
            class="telegram-feed" 
            src="https://t.me" 
            allow="autoplay; encrypted-media; fullscreen">
        </iframe>
    </div>
</div>

</body>
</html>
