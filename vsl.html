<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VusialBox</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg:#0b0c10;
    --bg-elevated:#15171c;
    --card:#1b1e24;
    --line:#262a32;
    --text:#eef0f2;
    --muted:#8b929e;
    --gold:#e8b45a;
    --gold-dim:#8a6a30;
    --red:#e0473a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:#2a2e36;border-radius:6px;}

  a{color:inherit;text-decoration:none;}
  img{display:block;}

  /* ---------- Header ---------- */
  header{
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;gap:28px;
    padding:16px 40px;
    background:linear-gradient(180deg,rgba(11,12,16,.97),rgba(11,12,16,.85));
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .brand{
    font-family:'Bebas Neue',sans-serif;
    font-size:30px;letter-spacing:1px;
    color:var(--text);
    display:flex;align-items:baseline;gap:2px;
  }
  .brand span{color:var(--gold);}
  nav{display:flex;gap:22px;}
  nav button{
    background:none;border:none;color:var(--muted);
    font-size:14.5px;font-weight:600;cursor:pointer;
    padding:6px 2px;border-bottom:2px solid transparent;
    transition:color .15s, border-color .15s;
  }
  nav button.active,nav button:hover{color:var(--text);border-color:var(--gold);}

  .search-wrap{margin-left:auto;position:relative;width:320px;max-width:40vw;}
  .search-wrap input{
    width:100%;background:var(--bg-elevated);border:1px solid var(--line);
    color:var(--text);padding:9px 14px 9px 36px;border-radius:8px;font-size:14px;
    outline:none;
  }
  .search-wrap input:focus{border-color:var(--gold-dim);}
  .search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.5;}

  .status-pill{
    font-size:11.5px;color:var(--muted);white-space:nowrap;
    border:1px solid var(--line);padding:4px 10px;border-radius:20px;
  }

  /* ---------- Hero ---------- */
  .hero{
    position:relative;height:56vh;min-height:340px;
    display:flex;align-items:flex-end;
    background:#000;
    overflow:hidden;
  }
  .hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55;filter:saturate(1.05);}
  .hero::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(11,12,16,0) 0%,rgba(11,12,16,.35) 55%,var(--bg) 100%),
               linear-gradient(90deg,rgba(11,12,16,.9) 0%,rgba(11,12,16,.1) 55%);
  }
  .hero-content{position:relative;z-index:2;padding:0 40px 42px;max-width:640px;}
  .hero-eyebrow{color:var(--gold);font-weight:700;font-size:13px;margin-bottom:10px;}
  .hero-title{font-family:'Bebas Neue',sans-serif;font-size:58px;line-height:.95;letter-spacing:.5px;margin:0 0 14px;}
  .hero-desc{color:var(--muted);font-size:14.5px;line-height:1.6;margin-bottom:20px;}
  .hero-actions{display:flex;gap:12px;}
  .btn{
    padding:11px 22px;border-radius:6px;font-weight:700;font-size:14px;cursor:pointer;border:none;
    display:inline-flex;align-items:center;gap:8px;
  }
  .btn-primary{background:var(--gold);color:#20160a;}
  .btn-primary:hover{background:#f0c273;}
  .btn-ghost{background:rgba(255,255,255,.08);color:var(--text);border:1px solid rgba(255,255,255,.18);}
  .btn-ghost:hover{background:rgba(255,255,255,.14);}

  /* ---------- Sections ---------- */
  main{padding:34px 40px 80px;}
  .row-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px;}
  .row-head h2{font-size:19px;margin:0;font-weight:700;}
  .row-head .count{color:var(--muted);font-size:13px;}

  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px;
  }

  .tile{
    cursor:pointer;position:relative;
  }
  .tile-poster{
    position:relative;aspect-ratio:2/3;border-radius:8px;overflow:hidden;
    background:var(--card);border:1px solid var(--line);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .tile:hover .tile-poster{transform:translateY(-4px);box-shadow:0 14px 28px rgba(0,0,0,.5);}
  .tile-poster img{width:100%;height:100%;object-fit:cover;}
  .tile-badge{
    position:absolute;top:8px;left:8px;background:rgba(0,0,0,.65);
    color:var(--gold);font-size:11px;font-weight:700;padding:3px 7px;border-radius:4px;
  }
  .stack-badge{
    position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.7);
    color:var(--text);font-size:11px;font-weight:600;padding:3px 8px;border-radius:12px;
    display:flex;align-items:center;gap:5px;
  }
  .tile-title{margin-top:9px;font-size:13.5px;font-weight:600;line-height:1.3;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

  .load-more{
    display:block;margin:26px auto 0;background:var(--bg-elevated);border:1px solid var(--line);
    color:var(--text);padding:10px 26px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13.5px;
  }
  .load-more:hover{border-color:var(--gold-dim);}

  .empty{color:var(--muted);padding:40px 0;text-align:center;font-size:14px;}

  /* ---------- Overlay / Series folder detail ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(5,6,8,.88);backdrop-filter:blur(3px);
    z-index:100;display:none;align-items:flex-start;justify-content:center;
    padding:5vh 20px;overflow-y:auto;
  }
  .overlay.open{display:flex;}
  .panel{
    width:min(880px,100%);background:var(--bg-elevated);border:1px solid var(--line);
    border-radius:14px;overflow:hidden;
  }
  .panel-top{
    position:relative;padding:34px 34px 22px;
    background:linear-gradient(180deg,rgba(0,0,0,.15),var(--bg-elevated) 88%), #1a1c22;
  }
  .close-btn{
    position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:50%;
    background:rgba(255,255,255,.08);border:none;color:var(--text);cursor:pointer;font-size:18px;
  }
  .close-btn:hover{background:rgba(255,255,255,.16);}
  .panel-top-inner{display:flex;gap:22px;}
  .panel-poster{width:130px;flex:none;border-radius:8px;overflow:hidden;border:1px solid var(--line);}
  .panel-poster img{width:100%;display:block;}
  .panel-title{font-family:'Bebas Neue',sans-serif;font-size:34px;margin:0 0 6px;letter-spacing:.4px;}
  .panel-meta{color:var(--muted);font-size:13px;margin-bottom:14px;}
  .panel-play{width:fit-content;}

  .season-stack{padding:8px 34px 34px;display:flex;flex-direction:column;gap:10px;}
  .season-card{
    background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;
  }
  .season-card summary{
    list-style:none;cursor:pointer;padding:15px 18px;display:flex;align-items:center;justify-content:between;
    gap:10px;font-weight:700;font-size:14.5px;
  }
  .season-card summary::-webkit-details-marker{display:none;}
  .season-card summary::after{content:"▾";margin-left:auto;color:var(--muted);transition:transform .15s;}
  .season-card[open] summary::after{transform:rotate(180deg);}
  .season-card summary .ep-count{color:var(--muted);font-weight:500;font-size:12.5px;}
  .ep-list{border-top:1px solid var(--line);padding:6px 10px;}
  .ep-row{
    display:flex;align-items:center;gap:12px;padding:11px 8px;border-radius:7px;cursor:pointer;
  }
  .ep-row:hover{background:rgba(255,255,255,.05);}
  .ep-num{
    width:30px;height:30px;border-radius:6px;background:var(--bg);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);flex:none;
  }
  .ep-title{font-size:13.5px;}

  /* ---------- Player overlay ---------- */
  .player-overlay{
    position:fixed;inset:0;background:#000;z-index:200;display:none;flex-direction:column;
  }
  .player-overlay.open{display:flex;}
  .player-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:#0b0c10;}
  .player-bar .close-btn{position:static;}
  .player-bar .ptitle{font-size:14px;font-weight:600;color:var(--muted);}
  .player-overlay iframe{flex:1;border:0;width:100%;}

  .spinner{
    width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--gold);
    border-radius:50%;animation:spin .8s linear infinite;margin:60px auto;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  @media (max-width:720px){
    header{padding:12px 16px;gap:14px;}
    nav{gap:12px;}
    .search-wrap{width:150px;}
    .status-pill{display:none;}
    main{padding:20px 16px 60px;}
    .hero-title{font-size:38px;}
    .hero-content{padding:0 16px 26px;}
    .panel-top-inner{flex-direction:column;}
    .panel-poster{width:96px;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">Vusial<span>Box</span></div>
  <nav>
    <button class="tab-btn active" data-tab="films">Films</button>
    <button class="tab-btn" data-tab="series">Séries</button>
  </nav>
  <div class="search-wrap">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="searchInput" type="text" placeholder="Rechercher un film, une série...">
  </div>
  <div class="status-pill" id="statusPill">Connexion au catalogue...</div>
</header>

<section class="hero" id="hero">
  <img id="heroImg" src="" alt="">
  <div class="hero-content">
    <div class="hero-eyebrow">EN VEDETTE</div>
    <h1 class="hero-title" id="heroTitle">VusialBox</h1>
    <p class="hero-desc" id="heroDesc">Ton catalogue de films et séries, à la demande. Regarde où tu veux, quand tu veux.</p>
    <div class="hero-actions">
      <button class="btn btn-primary" id="heroPlayBtn">▶ Regarder</button>
      <button class="btn btn-ghost" id="heroInfoBtn">Détails</button>
    </div>
  </div>
</section>

<main>
  <div id="searchResults" style="display:none;">
    <div class="row-head"><h2>Résultats de recherche</h2><span class="count" id="searchCount"></span></div>
    <div class="grid" id="searchGrid"></div>
    <div class="empty" id="searchEmpty" style="display:none;">Aucun résultat pour cette recherche.</div>
  </div>

  <div id="filmsSection">
    <div class="row-head"><h2>Films</h2><span class="count" id="filmsCount"></span></div>
    <div class="grid" id="filmsGrid"></div>
    <div class="spinner" id="filmsSpinner"></div>
    <button class="load-more" id="filmsLoadMore" style="display:none;">Charger plus</button>
  </div>

  <div id="seriesSection" style="display:none;">
    <div class="row-head"><h2>Séries</h2><span class="count" id="seriesCount"></span></div>
    <div class="grid" id="seriesGrid"></div>
    <div class="spinner" id="seriesSpinner"></div>
    <button class="load-more" id="seriesLoadMore" style="display:none;">Charger plus</button>
  </div>
</main>

<!-- Series folder detail overlay -->
<div class="overlay" id="seriesOverlay">
  <div class="panel">
    <div class="panel-top">
      <button class="close-btn" id="closeSeriesPanel">✕</button>
      <div class="panel-top-inner">
        <div class="panel-poster"><img id="panelPoster" src="" alt=""></div>
        <div>
          <h2 class="panel-title" id="panelTitle"></h2>
          <div class="panel-meta" id="panelMeta"></div>
          <button class="btn btn-primary panel-play" id="panelPlayFirst">▶ Lire le premier épisode</button>
        </div>
      </div>
    </div>
    <div class="season-stack" id="seasonStack">
      <div class="spinner"></div>
    </div>
  </div>
</div>

<!-- Player overlay -->
<div class="player-overlay" id="playerOverlay">
  <div class="player-bar">
    <span class="ptitle" id="playerTitle"></span>
    <button class="close-btn" id="closePlayer">✕</button>
  </div>
  <iframe id="playerFrame" src="" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="no-referrer"></iframe>
</div>

<script>
const API_BASE = 'https://45-61-145-6.sslip.io';
const PAGE_LIMIT = 24;

const state = {
  films: { page: 0, totalPages: 1, items: [] },
  series: { page: 0, totalPages: 1, items: [] },
};

const el = (id) => document.getElementById(id);

async function api(path) {
  const res = await fetch(API_BASE + path);
  if (!res.ok) throw new Error('Erreur API ' + res.status);
  return res.json();
}

function posterOr(url, w=300,h=450) {
  return url && url.length ? url : `data:image/svg+xml;utf8,` + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="#1b1e24"/></svg>`
  );
}

/* ---------------- Status ---------------- */
async function loadStatus() {
  try {
    const s = await api('/api/status');
    el('statusPill').textContent = `${s.movies.toLocaleString('fr-FR')} films · ${s.series.toLocaleString('fr-FR')} séries`;
  } catch (e) {
    el('statusPill').textContent = 'Catalogue indisponible';
  }
}

/* ---------------- Hero ---------------- */
async function loadHero() {
  try {
    const data = await api('/api/movies?page=1&limit=12');
    const pick = data.items[Math.floor(Math.random() * data.items.length)];
    if (!pick) return;
    el('heroImg').src = posterOr(pick.poster, 780, 440);
    el('heroTitle').textContent = pick.title;
    el('heroDesc').textContent = `Disponible maintenant dans le catalogue Films de VusialBox.`;
    el('heroPlayBtn').onclick = () => openMoviePlayer(pick);
    el('heroInfoBtn').onclick = () => document.getElementById('filmsSection').scrollIntoView({behavior:'smooth'});
  } catch (e) { /* silencieux, hero garde le fallback */ }
}

/* ---------------- Films ---------------- */
function renderTile(item, kind) {
  const tile = document.createElement('div');
  tile.className = 'tile';
  const badge = kind === 'series' && item.season_count
    ? `<span class="stack-badge">🗂 ${item.season_count} saison${item.season_count>1?'s':''}</span>` : '';
  tile.innerHTML = `
    <div class="tile-poster">
      <img loading="lazy" src="${posterOr(item.poster)}" alt="${item.title}">
      ${badge}
    </div>
    <div class="tile-title">${item.title}</div>
  `;
  tile.addEventListener('click', () => {
    if (kind === 'movie') openMoviePlayer(item);
    else openSeriesPanel(item);
  });
  return tile;
}

async function loadFilms() {
  const s = state.films;
  if (s.page >= s.totalPages && s.page !== 0) return;
  el('filmsSpinner').style.display = 'block';
  el('filmsLoadMore').style.display = 'none';
  try {
    const data = await api(`/api/movies?page=${s.page + 1}&limit=${PAGE_LIMIT}`);
    s.page = data.page;
    s.totalPages = data.total_pages;
    el('filmsCount').textContent = data.total.toLocaleString('fr-FR') + ' titres';
    const grid = el('filmsGrid');
    data.items.forEach(item => grid.appendChild(renderTile(item, 'movie')));
    el('filmsLoadMore').style.display = s.page < s.totalPages ? 'block' : 'none';
  } catch (e) {
    el('filmsCount').textContent = 'Erreur de chargement';
  } finally {
    el('filmsSpinner').style.display = 'none';
  }
}

async function loadSeries() {
  const s = state.series;
  if (s.page >= s.totalPages && s.page !== 0) return;
  el('seriesSpinner').style.display = 'block';
  el('seriesLoadMore').style.display = 'none';
  try {
    const data = await api(`/api/series?page=${s.page + 1}&limit=${PAGE_LIMIT}`);
    s.page = data.page;
    s.totalPages = data.total_pages;
    el('seriesCount').textContent = data.total.toLocaleString('fr-FR') + ' titres';
    const grid = el('seriesGrid');
    data.items.forEach(item => grid.appendChild(renderTile(item, 'series')));
    el('seriesLoadMore').style.display = s.page < s.totalPages ? 'block' : 'none';
  } catch (e) {
    el('seriesCount').textContent = 'Erreur de chargement';
  } finally {
    el('seriesSpinner').style.display = 'none';
  }
}

/* ---------------- Movie player ---------------- */
function openMoviePlayer(item) {
  el('playerTitle').textContent = item.title;
  el('playerFrame').src = `https://vixsrc.to/movie/${item.id}`;
  el('playerOverlay').classList.add('open');
}

/* ---------------- Series folder (seasons stacked) ---------------- */
async function openSeriesPanel(item) {
  el('panelPoster').src = posterOr(item.poster, 260, 390);
  el('panelTitle').textContent = item.title;
  el('panelMeta').textContent = `Série · ${item.season_count || '?'} saison${(item.season_count||0)>1?'s':''}`;
  el('seasonStack').innerHTML = '<div class="spinner"></div>';
  el('seriesOverlay').classList.add('open');

  try {
    const full = await api(`/api/series/${item.id}`);
    const stack = el('seasonStack');
    stack.innerHTML = '';
    if (!full.seasons || !full.seasons.length) {
      stack.innerHTML = '<div class="empty">Aucun épisode disponible pour cette série.</div>';
      return;
    }
    let firstEpUrl = null, firstEpLabel = '';
    full.seasons.forEach((season, idx) => {
      const details = document.createElement('details');
      details.className = 'season-card';
      if (idx === 0) details.open = true;
      const summary = document.createElement('summary');
      summary.innerHTML = `Saison ${season.season} <span class="ep-count">${season.episodes.length} épisode${season.episodes.length>1?'s':''}</span>`;
      details.appendChild(summary);

      const list = document.createElement('div');
      list.className = 'ep-list';
      season.episodes.forEach(ep => {
        if (!firstEpUrl) { firstEpUrl = ep.embed_url; firstEpLabel = `${full.title} · S${season.season}E${ep.number}`; }
        const row = document.createElement('div');
        row.className = 'ep-row';
        row.innerHTML = `<div class="ep-num">${ep.number}</div><div class="ep-title">${ep.title || 'Épisode ' + ep.number}</div>`;
        row.addEventListener('click', () => {
          el('playerTitle').textContent = `${full.title} · S${season.season}E${ep.number}`;
          el('playerFrame').src = ep.embed_url;
          el('playerOverlay').classList.add('open');
        });
        list.appendChild(row);
      });
      details.appendChild(list);
      stack.appendChild(details);
    });

    el('panelPlayFirst').onclick = () => {
      if (!firstEpUrl) return;
      el('playerTitle').textContent = firstEpLabel;
      el('playerFrame').src = firstEpUrl;
      el('playerOverlay').classList.add('open');
    };
  } catch (e) {
    el('seasonStack').innerHTML = '<div class="empty">Erreur de chargement des saisons.</div>';
  }
}

/* ---------------- Search ---------------- */
let searchDebounce;
function handleSearch(q) {
  clearTimeout(searchDebounce);
  if (!q.trim()) {
    el('searchResults').style.display = 'none';
    el('filmsSection').style.display = currentTab === 'films' ? 'block' : 'none';
    el('seriesSection').style.display = currentTab === 'series' ? 'block' : 'none';
    return;
  }
  searchDebounce = setTimeout(async () => {
    el('filmsSection').style.display = 'none';
    el('seriesSection').style.display = 'none';
    el('searchResults').style.display = 'block';
    const grid = el('searchGrid');
    grid.innerHTML = '<div class="spinner"></div>';
    try {
      const data = await api(`/api/search?q=${encodeURIComponent(q)}&limit=40`);
      grid.innerHTML = '';
      el('searchCount').textContent = data.total.toLocaleString('fr-FR') + ' résultat(s)';
      el('searchEmpty').style.display = data.items.length ? 'none' : 'block';
      data.items.forEach(item => grid.appendChild(renderTile(item, item.type === 'series' ? 'series' : 'movie')));
    } catch (e) {
      grid.innerHTML = '';
      el('searchCount').textContent = 'Erreur';
    }
  }, 350);
}

/* ---------------- Tabs ---------------- */
let currentTab = 'films';
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  el('filmsSection').style.display = tab === 'films' ? 'block' : 'none';
  el('seriesSection').style.display = tab === 'series' ? 'block' : 'none';
  el('searchResults').style.display = 'none';
  el('searchInput').value = '';
  if (tab === 'films' && state.films.items.length === 0 && state.films.page === 0) loadFilms();
  if (tab === 'series' && state.series.items.length === 0 && state.series.page === 0) loadSeries();
}

/* ---------------- Wiring ---------------- */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});
el('searchInput').addEventListener('input', (e) => handleSearch(e.target.value));
el('filmsLoadMore').addEventListener('click', loadFilms);
el('seriesLoadMore').addEventListener('click', loadSeries);
el('closeSeriesPanel').addEventListener('click', () => el('seriesOverlay').classList.remove('open'));
el('seriesOverlay').addEventListener('click', (e) => { if (e.target === el('seriesOverlay')) el('seriesOverlay').classList.remove('open'); });
el('closePlayer').addEventListener('click', () => { el('playerOverlay').classList.remove('open'); el('playerFrame').src = ''; });

loadStatus();
loadHero();
loadFilms();
</script>

</body>
</html>
